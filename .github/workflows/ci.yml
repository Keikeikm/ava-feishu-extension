name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/bot/ml/requirements.txt
      - run: npm ci
      - run: python -m pip install -r apps/bot/ml/requirements.txt
      - run: npm run build
      - run: npm test
        env:
          ML_PYTHON: python
      - run: npm exec -w @ava/base-plugin -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/base-plugin/test-results/
